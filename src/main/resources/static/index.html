<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blueprints</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="bg-light">
<div class="container py-4">

    <h1 class="text-center mb-4">Blueprints</h1>

    <div class="input-group mb-3">
        <span class="input-group-text">Author</span>
        <input id="authorInput" type="text" class="form-control" placeholder="Enter author name">
        <button id="getBlueprints" class="btn btn-primary">Get blueprints</button>
    </div>

    <h4>Author: <span id="authorName" class="fw-bold text-primary">-</span></h4>

    <div class="table-responsive mt-3">
        <table id="blueprintsTable" class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Blueprint name</th>
                <th>Points</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <!-- Aquí se llenarán los planos con jQuery -->
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <h5>Total user points: <span id="totalPoints" class="fw-bold text-success">0</span></h5>
    </div>

    <div class="mt-4 text-center">
        <canvas id="blueprintCanvas" width="800" height="500" class="border border-dark bg-white rounded"></canvas>
    </div>

    <div class="mt-3 text-center">
        <button id="saveBtn" class="btn btn-success" onclick="app.saveBlueprint()"> Save / Update Blueprint </button>
    </div>

</div>

<!-- Scripts de tu aplicación deben ir aquí -->
<script src="js/apiclient.js"></script>
<script src="js/apimock.js"></script>
<script src="js/app.js"></script>

<script>
    $("#getBlueprints").click(function () {
        const author = $("#authorInput").val();
        if (author) {
            app.changeAuthor(author);
            $("#authorName").text(author);
        }
    });
</script>
</body>
</html>
